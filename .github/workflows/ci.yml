name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        # The Maven project lives one level down from the repository root.
        working-directory: restaurant

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Caches ~/.m2/repository, keyed on the pom. Saves ~1 min per run.
          cache: maven

      - name: Build and run tests
        # verify runs compile, test and package. -B is batch mode: no progress
        # spam in the log. Tests use H2 today; once the add-to-cart work lands
        # they need Postgres, which ubuntu-latest can start via Docker Compose
        # with no extra configuration here.
        run: ./mvnw -B verify

      - name: Upload test reports
        # Runs even when the build fails - that is exactly when the reports matter.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: restaurant/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
