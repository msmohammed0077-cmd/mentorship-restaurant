# A profile-suffixed name, so this MERGES with src/main/resources/application.properties
# instead of shadowing it the way a plain application.properties in test resources did.
# The local profile stays active alongside it, because it supplies the datasource.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=false
