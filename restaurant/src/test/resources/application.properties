spring.application.name=restaurant

# Tests run against the same PostgreSQL the application uses, started from
# compose.yaml. H2 was previously used here, which hid two real bugs: Flyway
# could not run against PostgreSQL at all, and the entities did not match the
# migrations. Neither is visible when Hibernate builds the schema itself.
spring.docker.compose.skip.in-tests=false
spring.docker.compose.lifecycle-management=start-only

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55433/restaurant}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema. Hibernate only checks the entities match what the
# migrations produced, which is the check that catches drift.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
