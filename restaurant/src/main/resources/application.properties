spring.application.name=restaurant

spring.profiles.default=local

spring.jackson.property-naming-strategy=SNAKE_CASE

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.docker.compose.enabled=false


# Keycloak (#83). Keys are fetched on the first token, so the app starts without Keycloak.
# Inside compose the app reaches Keycloak as keycloak:8080; compose.yaml overrides jwk-set-uri.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/restaurant
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/restaurant/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=restaurant-api
# Clients whose login offers Keycloak registration: only their tokens may create an account on
# first request (#83 part 3, ADR 0010).
app.security.sign-up-clients=restaurant-swagger

# Swagger UI logs in through Keycloak's restaurant-swagger client (#83).
springdoc.swagger-ui.oauth.client-id=restaurant-swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
