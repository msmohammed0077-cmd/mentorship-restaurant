spring.application.name=restaurant

spring.profiles.default=local

spring.jackson.property-naming-strategy=SNAKE_CASE

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.docker.compose.enabled=false

# Stands in for RBAC until it exists. Keyed by USER id (not customer id):
# user 1 is customer 1, user 2 is customer 2. User 5 (customer 3, seeded by V6)
# is deliberately absent, which is what makes the 403 path reachable.
app.permissions.1=orders.read_order
app.permissions.2=orders.read_order
